name: holyhim
description: A word to stand on, every morning. Short daily Scripture lessons for men.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: 6.6.0
  share_plus: 12.0.0
  # Cognein's Liquid Glass: native iOS 26 tab bar and refracting glass.
  adaptive_platform_ui: 0.1.100
  liquid_glass_easy: 4.3.1
  liquid_glass_widgets: 0.30.2
  # Profile photos, as in Cognein: pick, crop, upload to his own folder.
  firebase_storage: ^14.0.1
  image_picker: ^1.0.4
  image: ^4.5.4
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  go_router: ^17.5.0
  http: ^1.6.0
  cupertino_icons: ^1.0.9
  sensors_plus: 7.1.1
  home_widget: 0.10.0
  path_provider: 2.1.6
  shared_preferences: ^2.5.3
  purchases_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/brand/
    - assets/artwork/
    - assets/art/library/
    - assets/art/chapters/unit-01/
    - assets/art/chapters/unit-02/
    - assets/art/chapters/unit-03/
    - assets/art/chapters/unit-04/
    - assets/art/chapters/unit-05/
    - assets/art/chapters/unit-06/
    - assets/art/chapters/unit-07/
    - assets/art/chapters/unit-08/
    - assets/art/chapters/unit-09/
    - assets/art/chapters/unit-10/
    - assets/art/chapters/unit-11/
    - assets/art/chapters/unit-12/
    - assets/art/chapters/unit-13/
    - assets/art/chapters/unit-14/
    - assets/art/chapters/unit-15/
    - assets/art/chapters/unit-16/
    - assets/art/chapters/unit-17/
    - assets/art/chapters/unit-18/
    - assets/art/chapters/unit-19/
    - assets/art/chapters/unit-20/
    - assets/art/chapters/unit-21/
    - assets/art/chapters/unit-22/
    - assets/art/chapters/unit-23/
    - assets/art/badges/
    - assets/fonts/SourceSerif4-OFL.txt
    - assets/fonts/manrope-OFL.txt
  fonts:
    - family: SourceSerif4Display
      fonts:
        - asset: assets/fonts/SourceSerif4Display-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4Display-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4Display-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
