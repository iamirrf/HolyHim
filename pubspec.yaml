name: holyhim
description: A quiet word with God, every morning. 365 short Scripture lessons.
publish_to: 'none'
version: 2.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: 6.6.0
  share_plus: 12.0.0
  # Cognein's Liquid Glass: native iOS 26 tab bar and refracting glass.
  adaptive_platform_ui: 0.1.100
  liquid_glass_easy: 4.3.1
  liquid_glass_widgets: 0.30.2
  # Profile photos, as in Cognein: pick, crop, upload to her own folder.
  firebase_storage: ^14.0.1
  image_picker: ^1.0.4
  image: ^4.5.4
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  go_router: ^17.5.0
  http: ^1.6.0
  cupertino_icons: ^1.0.9
  sensors_plus: 7.1.1
  home_widget: 0.10.0
  path_provider: 2.1.6
  shared_preferences: ^2.5.3
  purchases_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    # Every lesson read aloud (tool/voice/narrate.py), and the music beneath.
    - assets/audio/lessons/
    - assets/audio/music/
    - assets/icons/
    - assets/brand/
    - assets/artwork/
    - assets/art/lessons/
